<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Eşek Game</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial}#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#222;color:#fff;z-index:5}#menu h1{font-size:60px;margin:0 0 30px}#play{font-size:25px;padding:15px 50px;cursor:pointer}#info{position:absolute;top:10px;left:10px;padding:8px;background:#0009;color:#fff;z-index:2}</style>
</head><body>
<div id="menu"><h1>Eşek Game</h1><button id="play">Oyna</button></div>
<div id="info" style="display:none">WASD: hareket | Kırmızı: sen | Mavi: diğer oyuncu</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";
const menu=document.querySelector("#menu"),info=document.querySelector("#info");
document.querySelector("#play").onclick=()=>{menu.style.display="none";info.style.display="block";start()};
function start(){
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);
 const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
 scene.add(new THREE.AmbientLight(0xffffff,1));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(5,10,5);scene.add(light);
 const ground=new THREE.Mesh(new THREE.BoxGeometry(30,.5,30),new THREE.MeshStandardMaterial({color:0x55aa55}));ground.position.y=-.25;scene.add(ground);
 const player=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0xff3333}));player.position.y=.5;scene.add(player);
 const others=new Map(),keys={};addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
 const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);let last=0;
 ws.onmessage=e=>{const data=JSON.parse(e.data);if(data.type!=="players")return;const seen=new Set();
 for(const [id,p] of Object.entries(data.players)){if(id===data.me)continue;seen.add(id);let cube=others.get(id);
 if(!cube){cube=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0x3366ff}));cube.position.y=.5;scene.add(cube);others.set(id,cube)}
 cube.position.x=p.x;cube.position.z=p.z}
 for(const [id,cube] of others)if(!seen.has(id)){scene.remove(cube);others.delete(id)}};
 function loop(t){requestAnimationFrame(loop);const speed=.08;if(keys.w)player.position.z-=speed;if(keys.s)player.position.z+=speed;if(keys.a)player.position.x-=speed;if(keys.d)player.position.x+=speed;
 if(ws.readyState===WebSocket.OPEN&&t-last>50){last=t;ws.send(JSON.stringify({type:"move",x:player.position.x,z:player.position.z}))}
 camera.position.set(player.position.x,player.position.y+5,player.position.z+8);camera.lookAt(player.position);renderer.render(scene,camera)}
 loop(0);addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
}
</script></body></html>
