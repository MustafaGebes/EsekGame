<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eşek Game - Cross-Platform Online</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
        }

        h1 {
            color: #ffd700;
            font-size: 64px;
            margin: 0;
            text-shadow: 3px 3px 6px #000;
        }

        h2 {
            color: #ffffff;
            font-size: 24px;
            margin: 10px 0 20px 0;
            font-weight: 300;
        }

        .section-title {
            color: #aaaaaa;
            font-size: 18px;
            margin: 15px 0 5px 0;
        }

        .btn {
            padding: 12px 35px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background-color: #4CAF50;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            margin: 8px;
            min-width: 250px;
        }

        .btn:hover { transform: scale(1.05); }
        .btn-red { background-color: #f44336; }
        .btn-blue { background-color: #2196F3; }

        #info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 16px;
            pointer-events: none;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            display: none;
            z-index: 15;
        }

        #mobileControls {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            pointer-events: none;
            z-index: 10;
        }

        #joystickZone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
        }

        #joystickKnob {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
        }

        .mob-btn-group {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .mob-btn {
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffffff;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .mob-btn:active { background: rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body>

    <div id="menu">
        <h1>Eşek Game</h1>
        <h2>Cross-Platform Online Modu</h2>
        
        <div id="mainButtons">
            <div class="section-title">Kontrol Yönteminizi Seçin</div>
            <button id="pcSelectBtn" class="btn btn-blue">💻 PC KONTROLÜ</button><br>
            <button id="mobileSelectBtn" class="btn" style="background-color: #ff9800;">📱 MOBİL KONTROLÜ</button>
        </div>

        <div id="pauseButtons" style="display: none; flex-direction: column; align-items: center;">
            <button id="resumeBtn" class="btn">OYUNA DEVAM ET</button>
            <button id="returnMenuBtn" class="btn btn-red">MENÜYE DÖN</button>
        </div>
    </div>

    <div id="info">W,A,S,D: Yürü | Sol Tık + Sürükle: Etrafa Bak | Space: Zıpla | C: Eğil | ESC: Menü</div>

    <div id="mobileControls">
        <div id="joystickZone">
            <div id="joystickKnob"></div>
        </div>
        <div class="mob-btn-group">
            <button class="mob-btn" id="mobCrouchBtn">Eğil</button>
            <button class="mob-btn" id="mobJumpBtn">Zıpla</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        let ws = null;
        let myId = null;
        const otherPlayers = {};
        let controlMode = 'pc';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(100, 200, 100);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const terrainGeo = new THREE.PlaneGeometry(500, 500, 100, 100);
        terrainGeo.rotateX(-Math.PI / 2);
        const terrainMesh = new THREE.Mesh(terrainGeo, new THREE.MeshLambertMaterial({ color: 0x3d8c28 }));
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);

        function createDonkeyModel() {
            const donkeyGroup = new THREE.Group();
            const greyMat = new THREE.MeshLambertMaterial({ color: 0x808080 });
            const muzzleMat = new THREE.MeshLambertMaterial({ color: 0xdddddd });
            const blackMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

            function createBox(w, h, d, mat, x, y, z) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            const body = createBox(1.2, 1.0, 2.0, greyMat, 0, 1.5, 0);
            donkeyGroup.add(body);

            const neckHeadGroup = new THREE.Group();
            neckHeadGroup.position.set(0, 1.8, 0.7);

            const neck = createBox(0.6, 0.9, 0.6, greyMat, 0, 0.4, 0);
            neck.rotation.x = 0.3;
            neckHeadGroup.add(neck);
            
            const head = createBox(0.6, 0.6, 0.9, greyMat, 0, 0.9, 0.3);
            neckHeadGroup.add(head);
            
            const muzzle = createBox(0.58, 0.4, 0.4, muzzleMat, 0, 0.8, 0.75);
            neckHeadGroup.add(muzzle);

            const eyes = new THREE.Group();
            eyes.add(createBox(0.1, 0.1, 0.1, blackMat, 0.31, 1.0, 0.3));
            eyes.add(createBox(0.1, 0.1, 0.1, blackMat, -0.31, 1.0, 0.3));
            neckHeadGroup.add(eyes);

            const earLeft = createBox(0.15, 0.8, 0.2, greyMat, 0.25, 1.5, 0); earLeft.rotation.set(-0.2, 0, -0.2);
            const earRight = createBox(0.15, 0.8, 0.2, greyMat, -0.25, 1.5, 0); earRight.rotation.set(-0.2, 0, 0.2);
            neckHeadGroup.add(earLeft); neckHeadGroup.add(earRight);

            donkeyGroup.add(neckHeadGroup);

            const legs = [];
            [[0.4, 1.0, 0.7], [-0.4, 1.0, 0.7], [0.4, 1.0, -0.7], [-0.4, 1.0, -0.7]].forEach(pos => {
                const legGroup = new THREE.Group();
                legGroup.position.set(pos[0], pos[1], pos[2]);
                legGroup.add(createBox(0.3, 0.8, 0.3, greyMat, 0, -0.4, 0));
                legGroup.add(createBox(0.32, 0.2, 0.32, blackMat, 0, -0.9, 0));
                donkeyGroup.add(legGroup);
                legs.push(legGroup);
            });

            donkeyGroup.userData = { legs, neckHeadGroup };
            return donkeyGroup;
        }

        const playerDonkey = createDonkeyModel();
        playerDonkey.visible = false;
        scene.add(playerDonkey);

        function initWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === "init") {
                        myId = data.id;
                    }

                    if (data.type === "players" && myId) {
                        const serverPlayers = data.players;

                        for (let id in serverPlayers) {
                            if (id !== myId) {
                                if (!otherPlayers[id]) {
                                    const newDonkey = createDonkeyModel();
                                    scene.add(newDonkey);
                                    otherPlayers[id] = newDonkey;
                                }
                                const pData = serverPlayers[id];
                                otherPlayers[id].position.set(pData.x, pData.y, pData.z);
                                otherPlayers[id].rotation.y = pData.yaw || 0;
                                if (otherPlayers[id].userData.neckHeadGroup) {
                                    otherPlayers[id].userData.neckHeadGroup.rotation.x = pData.pitch || 0;
                                }
                            }
                        }

                        for (let id in otherPlayers) {
                            if (!serverPlayers[id]) {
                                scene.remove(otherPlayers[id]);
                                delete otherPlayers[id];
                            }
                        }
                    }
                } catch (e) {
                    console.error("Veri işleme hatası:", e);
                }
            };
        }

        let gameStarted = false;
        let yaw = 0, pitch = 0.3, velocityY = 0;
        let isGrounded = true;
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        const keys = { w: false, a: false, s: false, d: false, c: false };

        let joystickActive = false;
        let joystickMoveX = 0, joystickMoveZ = 0;
        let isCouchingMobile = false;

        const menuEl = document.getElementById('menu');
        const mainButtons = document.getElementById('mainButtons');
        const pauseButtons = document.getElementById('pauseButtons');
        const resumeBtn = document.getElementById('resumeBtn');
        const returnMenuBtn = document.getElementById('returnMenuBtn');
        const pcSelectBtn = document.getElementById('pcSelectBtn');
        const mobileSelectBtn = document.getElementById('mobileSelectBtn');
        const infoEl = document.getElementById('info');
        const mobileControlsEl = document.getElementById('mobileControls');

        function startGame(mode) {
            controlMode = mode;
            initWebSocket();
            playerDonkey.position.set(0, 0, 0);
            gameStarted = true;
            menuEl.style.display = 'none';
            playerDonkey.visible = true;

            if (controlMode === 'pc') {
                infoEl.style.display = 'block';
                mobileControlsEl.style.display = 'none';
            } else {
                infoEl.style.display = 'none';
                mobileControlsEl.style.display = 'block';
            }
        }

        pcSelectBtn.addEventListener('click', () => startGame('pc'));
        mobileSelectBtn.addEventListener('click', () => startGame('mobile'));

        resumeBtn.addEventListener('click', () => {
            initWebSocket();
            gameStarted = true;
            menuEl.style.display = 'none';
            playerDonkey.visible = true;
            infoEl.style.display = controlMode === 'pc' ? 'block' : 'none';
            mobileControlsEl.style.display = controlMode === 'mobile' ? 'block' : 'none';
        });

        returnMenuBtn.addEventListener('click', () => {
            gameStarted = false;
            menuEl.style.display = 'flex';
            mainButtons.style.display = 'block';
            pauseButtons.style.display = 'none';
            infoEl.style.display = 'none';
            mobileControlsEl.style.display = 'none';
            playerDonkey.visible = false;
            if (ws) { ws.close(); ws = null; }
            for (let id in otherPlayers) {
                scene.remove(otherPlayers[id]);
                delete otherPlayers[id];
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && gameStarted) {
                gameStarted = false;
                menuEl.style.display = 'flex';
                mainButtons.style.display = 'none';
                pauseButtons.style.display = 'flex';
                infoEl.style.display = 'none';
                mobileControlsEl.style.display = 'none';
                playerDonkey.visible = false;
                return;
            }
            if (!gameStarted || controlMode !== 'pc') return;

            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = true;
            if (k === 'a') keys.a = true;
            if (k === 's') keys.s = true;
            if (k === 'd') keys.d = true;
            if (k === 'c') keys.c = true;
            if (e.code === 'Space' && isGrounded) {
                velocityY = 0.35;
                isGrounded = false;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (!gameStarted || controlMode !== 'pc') return;
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = false;
            if (k === 'a') keys.a = false;
            if (k === 's') keys.s = false;
            if (k === 'd') keys.d = false;
            if (k === 'c') keys.c = false;
        });

        document.addEventListener('mousedown', (e) => {
            if (!gameStarted || controlMode !== 'pc' || e.button !== 0) return;
            isMouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        document.addEventListener('mouseup', () => { isMouseDown = false; });
        document.addEventListener('mousemove', (e) => {
            if (!gameStarted || !isMouseDown || controlMode !== 'pc') return;
            yaw -= (e.clientX - mouseX) * 0.005;
            pitch -= (e.clientY - mouseY) * 0.005;
            pitch = Math.max(-0.6, Math.min(1.0, pitch));
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        const joystickZone = document.getElementById('joystickZone');
        const joystickKnob = document.getElementById('joystickKnob');
        const mobJumpBtn = document.getElementById('mobJumpBtn');
        const mobCrouchBtn = document.getElementById('mobCrouchBtn');
        let touchStartX = 0, touchStartY = 0;

        joystickZone.addEventListener('touchstart', (e) => {
            joystickActive = true;
            touchStartX = e.targetTouches[0].clientX;
            touchStartY = e.targetTouches[0].clientY;
        });
        joystickZone.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            let dX = e.targetTouches[0].clientX - touchStartX;
            let dY = e.targetTouches[0].clientY - touchStartY;
            let dist = Math.min(45, Math.sqrt(dX * dX + dY * dY));
            let angle = Math.atan2(dY, dX);
            joystickKnob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            joystickMoveX = Math.cos(angle) * (dist / 45);
            joystickMoveZ = Math.sin(angle) * (dist / 45);
        });
        joystickZone.addEventListener('touchend', () => {
            joystickActive = false;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            joystickMoveX = 0; joystickMoveZ = 0;
        });

        mobJumpBtn.addEventListener('click', () => {
            if (gameStarted && isGrounded) { velocityY = 0.35; isGrounded = false; }
        });
        mobCrouchBtn.addEventListener('touchstart', () => { isCouchingMobile = true; });
        mobCrouchBtn.addEventListener('touchend', () => { isCouchingMobile = false; });

        let lastTouchX = 0, lastTouchY = 0;
        window.addEventListener('touchstart', (e) => {
            if (!gameStarted || controlMode !== 'mobile') return;
            if (e.target.closest('#joystickZone') || e.target.closest('.mob-btn-group') || e.target.closest('#menu')) return;
            lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY;
        });
        window.addEventListener('touchmove', (e) => {
            if (!gameStarted || controlMode !== 'mobile') return;
            if (e.target.closest('#joystickZone') || e.target.closest('.mob-btn-group') || e.target.closest('#menu')) return;
            let tX = e.touches[0].clientX, tY = e.touches[0].clientY;
            yaw -= (tX - lastTouchX) * 0.005;
            pitch -= (tY - lastTouchY) * 0.005;
            pitch = Math.max(-0.6, Math.min(1.0, pitch));
            lastTouchX = tX; lastTouchY = tY;
        });

        let walkCycle = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted) {
                let isCrouching = controlMode === 'pc' ? keys.c : isCouchingMobile;
                const speed = isCrouching ? 0.06 : 0.12;
                let moveX = 0, moveZ = 0, isMoving = false;

                if (controlMode === 'pc') {
                    if (keys.w) { moveX += Math.sin(yaw) * speed; moveZ += Math.cos(yaw) * speed; isMoving = true; }
                    if (keys.s) { moveX -= Math.sin(yaw) * speed; moveZ -= Math.cos(yaw) * speed; isMoving = true; }
                    if (keys.a) { moveX += Math.cos(yaw) * speed; moveZ -= Math.sin(yaw) * speed; isMoving = true; }
                    if (keys.d) { moveX -= Math.cos(yaw) * speed; moveZ += Math.sin(yaw) * speed; isMoving = true; }
                } else {
                    if (joystickActive) {
                        moveX += (Math.sin(yaw) * joystickMoveZ + Math.cos(yaw) * joystickMoveX) * speed * 1.5;
                        moveZ += (Math.cos(yaw) * joystickMoveZ - Math.sin(yaw) * joystickMoveX) * speed * 1.5;
                        isMoving = true;
                    }
                }

                playerDonkey.position.x += moveX;
                playerDonkey.position.z += moveZ;
                playerDonkey.rotation.y = yaw;

                playerDonkey.scale.y += ((isCrouching ? 0.6 : 1.0) - playerDonkey.scale.y) * 0.2;

                velocityY -= 0.015;
                playerDonkey.position.y += velocityY;
                if (playerDonkey.position.y <= 0) { playerDonkey.position.y = 0; velocityY = 0; isGrounded = true; }

                const legs = playerDonkey.userData.legs;
                if (isMoving && isGrounded) {
                    walkCycle += 0.15;
                    legs[0].rotation.x = Math.sin(walkCycle) * 0.5;
                    legs[1].rotation.x = -Math.sin(walkCycle) * 0.5;
                    legs[2].rotation.x = -Math.sin(walkCycle) * 0.5;
                    legs[3].rotation.x = Math.sin(walkCycle) * 0.5;
                } else {
                    legs.forEach(l => l.rotation.x *= 0.8);
                }

                if (playerDonkey.userData.neckHeadGroup) {
                    playerDonkey.userData.neckHeadGroup.rotation.x = pitch;
                }

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "move",
                        x: playerDonkey.position.x,
                        y: playerDonkey.position.y,
                        z: playerDonkey.position.z,
                        yaw: yaw,
                        pitch: pitch
                    }));
                }

                const distance = 6, heightOffset = isCrouching ? 1.8 : 2.5;
                camera.position.set(
                    playerDonkey.position.x - Math.sin(yaw) * distance,
                    playerDonkey.position.y + heightOffset + (pitch * 2),
                    playerDonkey.position.z - Math.cos(yaw) * distance
                );
                camera.lookAt(new THREE.Vector3(playerDonkey.position.x, playerDonkey.position.y + (isCrouching ? 1.0 : 1.5), playerDonkey.position.z));
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
