<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eşek Game - Online 3. Şahıs</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 20;
        }

        h1 {
            color: #ffd700;
            font-size: 64px;
            margin: 0;
            text-shadow: 3px 3px 6px #000;
        }

        h2 {
            color: #ffffff;
            font-size: 24px;
            margin: 10px 0 30px 0;
            font-weight: 300;
        }

        .btn {
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            background-color: #4CAF50;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            margin: 10px;
            min-width: 250px;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-red {
            background-color: #f44336;
        }

        #info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 16px;
            pointer-events: none;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            display: none;
            z-index: 15;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>Eşek Game</h1>
        <h2>Online 3. Şahıs Modu</h2>
        <button id="resumeBtn" class="btn" style="display: none;">OYUNA DEVAM ET</button>
        <button id="startBtn" class="btn">OYUNA BAŞLA</button>
        <button id="returnMenuBtn" class="btn btn-red" style="display: none;">MENÜYE DÖN</button>
    </div>

    <div id="info">W,A,S,D: Yürü | Sol Tık + Sürükle: Etrafa Bak | Space: Zıpla | C: Eğil | ESC: Menü</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        let ws = null;

        let myId = null;
        const otherPlayers = {};

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 3000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(100, 200, 100);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Zemin
        const terrainGeo = new THREE.PlaneGeometry(500, 500, 100, 100);
        terrainGeo.rotateX(-Math.PI / 2);
        const terrainMesh = new THREE.Mesh(terrainGeo, new THREE.MeshLambertMaterial({ color: 0x3d8c28 }));
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);

        // Eşek Modeli Oluşturucu
        function createDonkeyModel() {
            const donkeyGroup = new THREE.Group();
            const greyMat = new THREE.MeshLambertMaterial({ color: 0x808080 });
            const muzzleMat = new THREE.MeshLambertMaterial({ color: 0xdddddd });
            const blackMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

            function createBox(w, h, d, mat, x, y, z) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            const body = createBox(1.2, 1.0, 2.0, greyMat, 0, 1.5, 0);
            donkeyGroup.add(body);

            const neckHeadGroup = new THREE.Group();
            neckHeadGroup.position.set(0, 1.8, 0.7);

            const neck = createBox(0.6, 0.9, 0.6, greyMat, 0, 0.4, 0);
            neck.rotation.x = 0.3;
            neckHeadGroup.add(neck);
            
            const head = createBox(0.6, 0.6, 0.9, greyMat, 0, 0.9, 0.3);
            neckHeadGroup.add(head);
            
            const muzzle = createBox(0.58, 0.4, 0.4, muzzleMat, 0, 0.8, 0.75);
            neckHeadGroup.add(muzzle);

            const normalEyesGroup = new THREE.Group();
            normalEyesGroup.add(createBox(0.1, 0.1, 0.1, blackMat, 0.31, 1.0, 0.3));
            normalEyesGroup.add(createBox(0.1, 0.1, 0.1, blackMat, -0.31, 1.0, 0.3));
            neckHeadGroup.add(normalEyesGroup);

            const earLeft = createBox(0.15, 0.8, 0.2, greyMat, 0.25, 1.5, 0); earLeft.rotation.set(-0.2, 0, -0.2);
            const earRight = createBox(0.15, 0.8, 0.2, greyMat, -0.25, 1.5, 0); earRight.rotation.set(-0.2, 0, 0.2);
            neckHeadGroup.add(earLeft); neckHeadGroup.add(earRight);

            donkeyGroup.add(neckHeadGroup);

            const legs = [];
            [[0.4, 1.0, 0.7], [-0.4, 1.0, 0.7], [0.4, 1.0, -0.7], [-0.4, 1.0, -0.7]].forEach(pos => {
                const legGroup = new THREE.Group();
                legGroup.position.set(pos[0], pos[1], pos[2]);
                legGroup.add(createBox(0.3, 0.8, 0.3, greyMat, 0, -0.4, 0));
                legGroup.add(createBox(0.32, 0.2, 0.32, blackMat, 0, -0.9, 0));
                donkeyGroup.add(legGroup);
                legs.push(legGroup);
            });

            donkeyGroup.userData = { legs, neckHeadGroup, body };
            return donkeyGroup;
        }

        const playerDonkey = createDonkeyModel();
        playerDonkey.visible = false;
        scene.add(playerDonkey);

        function initWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return; // Zaten bağlıysa tekrar açma
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "players") {
                        myId = data.me;
                        const serverPlayers = data.players;

                        for (let id in serverPlayers) {
                            if (id !== myId) {
                                if (!otherPlayers[id]) {
                                    const newDonkey = createDonkeyModel();
                                    scene.add(newDonkey);
                                    otherPlayers[id] = newDonkey;
                                }
                                const pData = serverPlayers[id];
                                otherPlayers[id].position.set(pData.x, pData.y, pData.z);
                                otherPlayers[id].rotation.y = pData.yaw || 0;
                                if(otherPlayers[id].userData.neckHeadGroup) {
                                    otherPlayers[id].userData.neckHeadGroup.rotation.x = pData.pitch || 0;
                                }
                            }
                        }

                        for (let id in otherPlayers) {
                            if (!serverPlayers[id]) {
                                scene.remove(otherPlayers[id]);
                                delete otherPlayers[id];
                            }
                        }
                    }
                } catch (e) {
                    console.error("WebSocket veri hatası:", e);
                }
            };
        }

        let gameStarted = false;
        let yaw = 0, pitch = 0.3, velocityY = 0;
        let isGrounded = true;
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        const keys = { w: false, a: false, s: false, d: false, c: false };

        const menuEl = document.getElementById('menu');
        const startBtn = document.getElementById('startBtn');
        const resumeBtn = document.getElementById('resumeBtn');
        const returnMenuBtn = document.getElementById('returnMenuBtn');
        const infoEl = document.getElementById('info');

        function showMainMenu() {
            gameStarted = false;
            menuEl.style.display = 'flex';
            infoEl.style.display = 'none';
            startBtn.style.display = 'block';
            resumeBtn.style.display = 'none';
            returnMenuBtn.style.display = 'none';
            
            if (ws) { ws.close(); ws = null; }
            playerDonkey.visible = false;
            playerDonkey.position.set(0, 0, 0);

            for (let id in otherPlayers) {
                scene.remove(otherPlayers[id]);
                delete otherPlayers[id];
            }
        }

        function showPauseMenu() {
            gameStarted = false;
            menuEl.style.display = 'flex';
            infoEl.style.display = 'none';
            startBtn.style.display = 'none';
            resumeBtn.style.display = 'block';
            returnMenuBtn.style.display = 'block';
            playerDonkey.visible = false;
        }

        // Oyuna İlk Başla
        startBtn.addEventListener('click', () => {
            initWebSocket();
            playerDonkey.position.set(0, 0, 0);
            gameStarted = true;
            menuEl.style.display = 'none';
            infoEl.style.display = 'block';
            playerDonkey.visible = true;
        });

        // Oyuna Devam Et (ESC menüsünden)
        resumeBtn.addEventListener('click', () => {
            initWebSocket();
            gameStarted = true;
            menuEl.style.display = 'none';
            infoEl.style.display = 'block';
            playerDonkey.visible = true;
        });

        // Menüye Dön (ESC menüsünden)
        returnMenuBtn.addEventListener('click', () => {
            showMainMenu();
        });

        // ESC tuşu ile menüyü açma
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (gameStarted) {
                    showPauseMenu();
                }
            }
            if (!gameStarted) return;

            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = true;
            if (k === 'a') keys.a = true;
            if (k === 's') keys.s = true;
            if (k === 'd') keys.d = true;
            if (k === 'c') keys.c = true;
            if (e.code === 'Space' && isGrounded) {
                velocityY = 0.35;
                isGrounded = false;
            }
        });

        document.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = false;
            if (k === 'a') keys.a = false;
            if (k === 's') keys.s = false;
            if (k === 'd') keys.d = false;
            if (k === 'c') keys.c = false;
        });

        document.addEventListener('mousedown', (e) => {
            if (!gameStarted) return;
            if (e.button === 0) {
                isMouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            }
        });

        document.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (!gameStarted || !isMouseDown) return;

            const deltaX = e.clientX - mouseX;
            const deltaY = e.clientY - mouseY;

            yaw -= deltaX * 0.005;
            pitch -= deltaY * 0.005;
            pitch = Math.max(-0.6, Math.min(1.0, pitch));

            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('beforeunload', () => {
            if (ws) ws.close();
        });

        let walkCycle = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted) {
                const speed = keys.c ? 0.06 : 0.12;
                let moveX = 0, moveZ = 0;
                let isMoving = false;

                if (keys.w) { moveX += Math.sin(yaw) * speed; moveZ += Math.cos(yaw) * speed; isMoving = true; }
                if (keys.s) { moveX -= Math.sin(yaw) * speed; moveZ -= Math.cos(yaw) * speed; isMoving = true; }
                if (keys.a) { moveX += Math.cos(yaw) * speed; moveZ -= Math.sin(yaw) * speed; isMoving = true; }
                if (keys.d) { moveX -= Math.cos(yaw) * speed; moveZ += Math.sin(yaw) * speed; isMoving = true; }

                playerDonkey.position.x += moveX;
                playerDonkey.position.z += moveZ;
                playerDonkey.rotation.y = yaw;

                const targetScaleY = keys.c ? 0.6 : 1.0;
                playerDonkey.scale.y += (targetScaleY - playerDonkey.scale.y) * 0.2;

                velocityY -= 0.015;
                playerDonkey.position.y += velocityY;
                if (playerDonkey.position.y <= 0) {
                    playerDonkey.position.y = 0;
                    velocityY = 0;
                    isGrounded = true;
                }

                const legs = playerDonkey.userData.legs;
                if (isMoving && isGrounded) {
                    walkCycle += 0.15;
                    legs[0].rotation.x = Math.sin(walkCycle) * 0.5;
                    legs[1].rotation.x = -Math.sin(walkCycle) * 0.5;
                    legs[2].rotation.x = -Math.sin(walkCycle) * 0.5;
                    legs[3].rotation.x = Math.sin(walkCycle) * 0.5;
                } else {
                    legs.forEach(l => l.rotation.x *= 0.8);
                }

                if (playerDonkey.userData.neckHeadGroup) {
                    playerDonkey.userData.neckHeadGroup.rotation.x = pitch;
                }

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "move",
                        x: playerDonkey.position.x,
                        y: playerDonkey.position.y,
                        z: playerDonkey.position.z,
                        yaw: yaw,
                        pitch: pitch
                    }));
                }

                const distance = 6;
                const heightOffset = keys.c ? 1.8 : 2.5;

                const camX = playerDonkey.position.x - Math.sin(yaw) * distance;
                const camZ = playerDonkey.position.z - Math.cos(yaw) * distance;
                const camY = playerDonkey.position.y + heightOffset + (pitch * 2);

                camera.position.set(camX, camY, camZ);
                
                const lookAtTarget = new THREE.Vector3(
                    playerDonkey.position.x,
                    playerDonkey.position.y + (keys.c ? 1.0 : 1.5),
                    playerDonkey.position.z
                );
                camera.lookAt(lookAtTarget);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
