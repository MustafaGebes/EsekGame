<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Eşek Game</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#222;color:#fff;z-index:5}
#menu h1{font-size:60px;margin:0 0 30px}
#play{font-size:25px;padding:15px 50px;cursor:pointer}
#info{position:absolute;top:10px;left:10px;padding:8px;background:#0009;color:#fff;z-index:2;pointer-events:none}
</style>
</head><body>
<div id="menu"><h1>Eşek Game</h1><button id="play">Oyuna Başla (Tıkla)</button></div>
<div id="info" style="display:none">WASD: Hareket | Fare: Etrafa Bakma | SPACE: Zıpla | SHIFT: Koş | C: Eğil</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";

const menu=document.querySelector("#menu"), info=document.querySelector("#info");
let scene, camera, renderer, ws;
let playerGroup, otherPlayers=new Map();
let keys={};
let velocityY=0, isGrounded=true;
let yaw=0, pitch=0; // Fare açıları

document.querySelector("#play").onclick=()=>{
    menu.style.display="none";
    info.style.display="block";
    document.body.requestPointerLock();
    init();
};

document.addEventListener("pointerlockchange",()=>{
    if(document.pointerLockElement!==document.body && menu.style.display==="none"){
        menu.style.display="flex";
        info.style.display="none";
    }
});

addEventListener("mousemove",e=>{
    if(document.pointerLockElement===document.body){
        yaw -= e.movementX * 0.003;
        pitch -= e.movementY * 0.003;
        pitch = Math.max(-Math.random()*0.1 - 0.2, Math.min(1.2, pitch));
    }
});

addEventListener("keydown",e=>{ keys[e.key.toLowerCase()]=true; });
addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });

// Detaylı Eşek Modeli Oluşturma Fonksiyonu
function createDonkeyModel(isMe = true) {
    const group = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({color: 0x887766});
    const darkMat = new THREE.MeshStandardMaterial({color: 0x443322});
    const whiteMat = new THREE.MeshStandardMaterial({color: 0xeeeedd});

    // Gövde
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.9, 2.2), bodyMat);
    body.position.y = 1.1;
    body.castShadow = true;
    group.add(body);

    // Kafa
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 1.3), bodyMat);
    head.position.set(0, 1.8, 1.2);
    group.add(head);

    // Burun
    const snout = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.5), whiteMat);
    snout.position.set(0, 1.65, 1.8);
    group.add(snout);

    // Kulaklar (Uzun eşek kulakları)
    const earGeo = new THREE.BoxGeometry(0.15, 0.9, 0.25);
    const ear1 = new THREE.Mesh(earGeo, bodyMat);
    ear1.position.set(0.25, 2.4, 0.9);
    ear1.rotation.z = -0.1;
    group.add(ear1);

    const ear2 = new THREE.Mesh(earGeo, bodyMat);
    ear2.position.set(-0.25, 2.4, 0.9);
    ear2.rotation.z = 0.1;
    group.add(ear2);

    // Bacaklar
    const legGeo = new THREE.BoxGeometry(0.3, 1.0, 0.3);
    const leg1 = new THREE.Mesh(legGeo, darkMat); leg1.position.set(0.4, 0.5, 0.8); group.add(leg1);
    const leg2 = new THREE.Mesh(legGeo, darkMat); leg2.position.set(-0.4, 0.5, 0.8); group.add(leg2);
    const leg3 = new THREE.Mesh(legGeo, darkMat); leg3.position.set(0.4, 0.5, -0.8); group.add(leg3);
    const leg4 = new THREE.Mesh(legGeo, darkMat); leg4.position.set(-0.4, 0.5, -0.8); group.add(leg4);

    // Kuyruk
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.1), darkMat);
    tail.position.set(0, 1.0, -1.2);
    tail.rotation.x = 0.3;
    group.add(tail);

    return group;
}

function init(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

    camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerWidth);
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(100, 200, 100);
    scene.add(sun);

    // Koçaman Çimen Zemin (Boyut: 400x400)
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(400, 400),
        new THREE.MeshStandardMaterial({color: 0x3b8a3b, roughness: 0.9})
    );
    ground.rotation.x = -Math.PI/2;
    scene.add(ground);

    // Yerlerde Gerçekçi Küçük Çimen Detayları (Instanced / Rastgele Kutucuklar)
    const grassMat = new THREE.MeshStandardMaterial({color: 0x2e7d32});
    const grassGeo = new THREE.BoxGeometry(0.15, 0.6, 0.15);
    for(let i=0; i<1500; i++){
        const g = new THREE.Mesh(grassGeo, grassMat);
        const x = (Math.random() - 0.5) * 360;
        const z = (Math.random() - 0.5) * 360;
        g.position.set(x, 0.3, z);
        scene.add(g);
    }

    // Etrafı Çeviren Dağlar (Sınır Oluşturma)
    const mountainMat = new THREE.MeshStandardMaterial({color: 0x5c5243, roughness: 1.0});
    for(let i=0; i<30; i++){
        const angle = (i / 30) * Math.PI * 2;
        const radius = 180;
        const mountain = new THREE.Mesh(
            new THREE.ConeGeometry(35 + Math.random()*15, 60 + Math.random()*30, 4),
            mountainMat
        );
        mountain.position.set(Math.cos(angle)*radius, 25, Math.sin(angle)*radius);
        scene.add(mountain);
    }

    // Oyuncu Eşek Modeli
    playerGroup = createDonkeyModel(true);
    playerGroup.position.set(0, 0, 0);
    scene.add(playerGroup);

    // WebSocket Bağlantısı
    ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
    let last=0;

    ws.onmessage = e => {
        const data = JSON.parse(e.data);
        if(data.type!=="players") return;
        const seen = new Set();
        
        for(const [id, p] of Object.entries(data.players)){
            if(id === data.me) continue;
            seen.add(id);
            let donkey = otherPlayers.get(id);
            if(!donkey){
                donkey = createDonkeyModel(false);
                scene.add(donkey);
                otherPlayers.set(id, donkey);
            }
            donkey.position.set(p.x, p.y, p.z);
            donkey.rotation.y = p.ry || 0;
        }
        for(const [id, donkey] of otherPlayers){
            if(!seen.has(id)){
                scene.remove(donkey);
                otherPlayers.delete(id);
            }
        }
    };

    function animate(t){
        requestAnimationFrame(animate);

        let speed = 0.12;
        if(keys["shift"]) speed = 0.24; // Koşma

        // Hareket yönleri (Fare açısına göre)
        let moveX = 0, moveZ = 0;
        if(keys["w"]){ moveX -= Math.sin(yaw)*speed; moveZ -= Math.cos(yaw)*speed; }
        if(keys["s"]){ moveX += Math.sin(yaw)*speed; moveZ += Math.cos(yaw)*speed; }
        if(keys["a"]){ moveX -= Math.cos(yaw)*speed; moveZ += Math.sin(yaw)*speed; }
        if(keys["d"]){ moveX += Math.cos(yaw)*speed; moveZ -= Math.sin(yaw)*speed; }

        playerGroup.position.x += moveX;
        playerGroup.position.z += moveZ;

        // Dağ Sınırları İçinde Tutma (Geçilmez Sınır - Map Sınırı)
        playerGroup.position.x = Math.max(-175, Math.min(175, playerGroup.position.x));
        playerGroup.position.z = Math.max(-175, Math.min(175, playerGroup.position.z));

        // Eğilme (C tuşu)
        if(keys["c"]){
            playerGroup.scale.set(1, 0.6, 1);
        } else {
            playerGroup.scale.set(1, 1, 1);
        }

        // Zıplama ve Yerçekimi
        if(keys[" "] && isGrounded){
            velocityY = 0.18;
            isGrounded = false;
        }
        velocityY -= 0.01; // Yerçekimi
        playerGroup.position.y += velocityY;
        if(playerGroup.position.y <= 0){
            playerGroup.position.y = 0;
            velocityY = 0;
            isGrounded = true;
        }

        // Eşek Yönünü Fareye Göre Çevirme
        playerGroup.rotation.y = yaw;

        // Sunucuya Konum Gönderme
        if(ws.readyState===WebSocket.OPEN && t-last > 50){
            last = t;
            ws.send(JSON.stringify({
                type: "move",
                x: playerGroup.position.x,
                y: playerGroup.position.y,
                z: playerGroup.position.z,
                ry: playerGroup.rotation.y
            }));
        }

        // Kamera Takibi (Üçüncü Şahıs / Arkadan Bakış)
        let camDist = 6;
        let camHeight = 2.5;
        let cx = playerGroup.position.x + Math.sin(yaw) * camDist;
        let cz = playerGroup.position.z + Math.cos(yaw) * camDist;
        let cy = playerGroup.position.y + camHeight + pitch * 3;
        
        camera.position.set(cx, cy, cz);
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z);

        renderer.render(scene, camera);
    }
    animate(0);

    addEventListener("resize",()=>{
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });
}
</script>
</body></html>
