<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eşek Game - Online 3. Şahıs</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            z-index: 20;
        }

        h1 {
            color: #ffd700;
            font-size: 64px;
            margin: 0;
            text-shadow: 3px 3px 6px #000;
        }

        h2 {
            color: #ffffff;
            font-size: 24px;
            margin: 10px 0 30px 0;
            font-weight: 300;
        }

        .btn {
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            background-color: #4CAF50;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        #info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 16px;
            pointer-events: none;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            display: none;
            z-index: 15;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>Eşek Game</h1>
        <h2>Online 3. Şahıs Modu</h2>
        <button id="startBtn" class="btn">OYUNA BAŞLA</button>
    </div>

    <div id="info">W,A,S,D: Yürü | Fare: Etrafa Bak | Space: Zıpla</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 3000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(100, 200, 100);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Zemin
        const terrainGeo = new THREE.PlaneGeometry(500, 500, 100, 100);
        terrainGeo.rotateX(-Math.PI / 2);
        const terrainMesh = new THREE.Mesh(terrainGeo, new THREE.MeshLambertMaterial({ color: 0x3d8c28 }));
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);

        // Eşek Modeli Oluşturma Fonksiyonu
        function createDonkeyModel() {
            const donkeyGroup = new THREE.Group();
            const greyMat = new THREE.MeshLambertMaterial({ color: 0x808080 });
            const muzzleMat = new THREE.MeshLambertMaterial({ color: 0xdddddd });
            const blackMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

            function createBox(w, h, d, mat, x, y, z) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            // Gövde
            donkeyGroup.add(createBox(1.2, 1.0, 2.0, greyMat, 0, 1.5, 0));

            // Boyun ve Baş Grubu (Yüzü öne bakacak şekilde)
            const neckHeadGroup = new THREE.Group();
            neckHeadGroup.position.set(0, 1.8, 0.7);

            const neck = createBox(0.6, 0.9, 0.6, greyMat, 0, 0.4, 0);
            neck.rotation.x = 0.3;
            neckHeadGroup.add(neck);
            
            const head = createBox(0.6, 0.6, 0.9, greyMat, 0, 0.9, 0.3);
            neckHeadGroup.add(head);
            
            const muzzle = createBox(0.58, 0.4, 0.4, muzzleMat, 0, 0.8, 0.75);
            neckHeadGroup.add(muzzle);

            const normalEyesGroup = new THREE.Group();
            normalEyesGroup.add(createBox(0.1, 0.1, 0.1, blackMat, 0.31, 1.0, 0.3));
            normalEyesGroup.add(createBox(0.1, 0.1, 0.1, blackMat, -0.31, 1.0, 0.3));
            neckHeadGroup.add(normalEyesGroup);

            const earLeft = createBox(0.15, 0.8, 0.2, greyMat, 0.25, 1.5, 0); earLeft.rotation.set(-0.2, 0, -0.2);
            const earRight = createBox(0.15, 0.8, 0.2, greyMat, -0.25, 1.5, 0); earRight.rotation.set(-0.2, 0, 0.2);
            neckHeadGroup.add(earLeft); neckHeadGroup.add(earRight);

            donkeyGroup.add(neckHeadGroup);

            // Bacaklar
            [[0.4, 1.0, 0.7], [-0.4, 1.0, 0.7], [0.4, 1.0, -0.7], [-0.4, 1.0, -0.7]].forEach(pos => {
                const legGroup = new THREE.Group();
                legGroup.position.set(pos[0], pos[1], pos[2]);
                legGroup.add(createBox(0.3, 0.8, 0.3, greyMat, 0, -0.4, 0));
                legGroup.add(createBox(0.32, 0.2, 0.32, blackMat, 0, -0.9, 0));
                donkeyGroup.add(legGroup);
            });

            return donkeyGroup;
        }

        const playerDonkey = createDonkeyModel();
        scene.add(playerDonkey);

        let gameStarted = false;
        let yaw = 0, pitch = 0.3, velocityY = 0;
        let isGrounded = true;
        const keys = { w: false, a: false, s: false, d: false };
        const otherPlayers = {};

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('info').style.display = 'block';
            gameStarted = true;
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body && gameStarted) {
                yaw -= e.movementX * 0.003;
                pitch -= e.movementY * 0.003;
                pitch = Math.max(-0.2, Math.min(1.2, pitch));
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!gameStarted) return;
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = true;
            if (k === 'a') keys.a = true;
            if (k === 's') keys.s = true;
            if (k === 'd') keys.d = true;
            if (e.code === 'Space' && isGrounded) {
                velocityY = 0.35;
                isGrounded = false;
            }
        });

        document.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = false;
            if (k === 'a') keys.a = false;
            if (k === 's') keys.s = false;
            if (k === 'd') keys.d = false;
        });

        // --- SOCKET.IO ONLINE SENKRONİZASYON ---
        socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach((id) => {
                if (id !== socket.id) {
                    addOtherPlayer(players[id]);
                }
            });
        });

        socket.on('newPlayer', (playerInfo) => {
            addOtherPlayer(playerInfo);
        });

        socket.on('playerDisconnected', (id) => {
            if (otherPlayers[id]) {
                scene.remove(otherPlayers[id]);
                delete otherPlayers[id];
            }
        });

        socket.on('playerMoved', (playerInfo) => {
            if (otherPlayers[playerInfo.id]) {
                otherPlayers[playerInfo.id].position.set(playerInfo.x, playerInfo.y, playerInfo.z);
                otherPlayers[playerInfo.id].rotation.y = playerInfo.rotation;
            }
        });

        function addOtherPlayer(info) {
            const donkey = createDonkeyModel();
            donkey.position.set(info.x, info.y, info.z);
            scene.add(donkey);
            otherPlayers[info.id] = donkey;
        }

        // Oyun Döngüsü
        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted) {
                const speed = 0.12;
                let moveX = 0, moveZ = 0;
                if (keys.w) { moveX -= Math.sin(yaw) * speed; moveZ -= Math.cos(yaw) * speed; }
                if (keys.s) { moveX += Math.sin(yaw) * speed; moveZ += Math.cos(yaw) * speed; }
                if (keys.a) { moveX -= Math.cos(yaw) * speed; moveZ += Math.sin(yaw) * speed; }
                if (keys.d) { moveX += Math.cos(yaw) * speed; moveZ -= Math.sin(yaw) * speed; }

                playerDonkey.position.x += moveX;
                playerDonkey.position.z += moveZ;
                playerDonkey.rotation.y = yaw;

                velocityY -= 0.015;
                playerDonkey.position.y += velocityY;
                if (playerDonkey.position.y <= 0) {
                    playerDonkey.position.y = 0;
                    velocityY = 0;
                    isGrounded = true;
                }

                // Konumumuzu sunucuya bildir
                socket.emit('playerMovement', {
                    x: playerDonkey.position.x,
                    y: playerDonkey.position.y,
                    z: playerDonkey.position.z,
                    rotation: yaw
                });

                // --- DÜZELTİLMİŞ 3. ŞAHIS KAMERA (ARKADAN ÖNE BAKIŞ) ---
                const distance = 6; // Eşeğe uzaklık
                const heightOffset = 2.5; // Yükseklik

                // Kameranın eşeğin arkasında kalmasını sağlayan hesaplama
                const camX = playerDonkey.position.x - Math.sin(yaw) * distance;
                const camZ = playerDonkey.position.z - Math.cos(yaw) * distance;
                const camY = playerDonkey.position.y + heightOffset + (pitch * 3);

                camera.position.set(camX, camY, camZ);
                
                // Kameranın eşeğin arkasından öne (yüzüne/gövdesine) doğru bakması
                const lookAtTarget = new THREE.Vector3(
                    playerDonkey.position.x,
                    playerDonkey.position.y + 1.5,
                    playerDonkey.position.z
                );
                camera.lookAt(lookAtTarget);
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
