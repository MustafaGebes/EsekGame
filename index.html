<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eşek Game - Online</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: Arial, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.85); z-index: 20; }
        h1 { color: #ffd700; font-size: 64px; margin: 0; text-shadow: 3px 3px 6px #000; }
        h2 { color: #ffffff; font-size: 24px; margin: 10px 0 20px 0; font-weight: 300; }
        .section-title { color: #aaaaaa; font-size: 18px; margin: 15px 0 5px 0; }
        .btn { padding: 12px 35px; font-size: 20px; font-weight: bold; color: #ffffff; background-color: #4CAF50; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.2s; margin: 8px; min-width: 250px; }
        .btn:hover { transform: scale(1.05); }
        .btn-red { background-color: #f44336; }
        .btn-blue { background-color: #2196F3; }
        #info { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #ffffff; font-size: 16px; pointer-events: none; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); display: none; z-index: 15; }
        
        #mobileControls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; z-index: 10; }
        
        #mobMenuBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffffff;
            color: #ffffff;
            font-size: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            cursor: pointer;
            z-index: 25;
        }

        #joystickZone { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%; pointer-events: auto; touch-action: none; }
        #joystickKnob { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.7); border-radius: 50%; pointer-events: none; }
        
        .mob-btn-group { position: absolute; bottom: 40px; right: 40px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; align-items: center; }
        .mob-btn { width: 70px; height: 70px; background: rgba(0, 0, 0, 0.5); border: 2px solid #ffffff; color: #ffffff; font-size: 16px; font-weight: bold; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .mob-btn:active { background: rgba(255, 255, 255, 0.4); }
        .mob-btn-sprint { background: rgba(255, 152, 0, 0.7); border-color: #ff9800; }

        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffffff;
            font-size: 16px;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 15;
            text-shadow: 1px 1px 2px #000;
            display: none;
        }
        #hud div { margin: 3px 0; }
        #hud .label { color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>Eşek Game</h1>
        <h2>Cross-Platform Online Modu</h2>
        
        <div id="mainButtons">
            <div class="section-title">Kontrol Yönteminizi Seçin</div>
            <button id="pcSelectBtn" class="btn btn-blue">💻 PC KONTROLÜ</button><br>
            <button id="mobileSelectBtn" class="btn" style="background-color: #ff9800;">📱 MOBİL KONTROLÜ</button>
        </div>

        <div id="pauseButtons" style="display: none; flex-direction: column; align-items: center;">
            <button id="resumeBtn" class="btn">OYUNA DEVAM ET</button>
            <button id="returnMenuBtn" class="btn btn-red">MENÜYE DÖN</button>
        </div>
    </div>

    <div id="info">W,A,S,D: Yürü | Shift: Koş | Sol Tık + Sürükle: Etrafa Bak | Space: Zıpla | C: Eğil | ESC: Menü</div>

    <div id="hud">
        <div><span class="label">Saat:</span> <span id="hudTime">00:00</span></div>
        <div><span class="label">FPS:</span> <span id="hudFps">60</span></div>
        <div><span class="label">Gün:</span> <span id="hudDay">1</span></div>
    </div>

    <div id="mobileControls">
        <div id="mobMenuBtn">☰</div>

        <div id="joystickZone">
            <div id="joystickKnob"></div>
        </div>
        <div class="mob-btn-group">
            <button class="mob-btn mob-btn-sprint" id="mobSprintBtn">KOŞ</button>
            <button class="mob-btn" id="mobCrouchBtn">Eğil</button>
            <button class="mob-btn" id="mobJumpBtn">Zıpla</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        
        let ws = null;
        let myId = null;
        const otherPlayers = {};
        let controlMode = 'pc';

        const MAP_LIMIT = 200;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Menüdeyken de mavi gökyüzü

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // === IŞIKLAR ===
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(100, 200, 100);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.left = -300;
        sunLight.shadow.camera.right = 300;
        sunLight.shadow.camera.top = 300;
        sunLight.shadow.camera.bottom = -300;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 1000;
        scene.add(sunLight);

        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(15, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffff00 })
        );
        scene.add(sunMesh);

        const moonLight = new THREE.DirectionalLight(0xaaccff, 0.3);
        moonLight.position.set(-100, 200, -100);
        scene.add(moonLight);

        const moonMesh = new THREE.Mesh(
            new THREE.SphereGeometry(10, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xeeeeee })
        );
        scene.add(moonMesh);

        // === ZEMİN ===
        const terrainGeo = new THREE.PlaneGeometry(500, 500, 100, 100);
        terrainGeo.rotateX(-Math.PI / 2);
        const terrainMesh = new THREE.Mesh(terrainGeo, new THREE.MeshLambertMaterial({ color: 0x2d5a1e }));
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);

        // ==========================================
        // ÖNCE DAĞLARI OLUŞTUR (Otlar dağlardan kaçınsın diye)
        // ==========================================
        const mountains = [];

        function createMountain(x, z, baseRadius, height) {
            const mountainGroup = new THREE.Group();
            
            const mountainMat = new THREE.MeshLambertMaterial({ color: 0x8b7355 });
            const mountainGeo = new THREE.ConeGeometry(baseRadius, height, 8);
            const mountainMesh = new THREE.Mesh(mountainGeo, mountainMat);
            mountainMesh.position.y = height / 2;
            mountainMesh.castShadow = true;
            mountainMesh.receiveShadow = true;
            mountainGroup.add(mountainMesh);

            const snowMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const snowHeight = height * 0.3;
            const snowRadius = baseRadius * 0.35;
            const snowGeo = new THREE.ConeGeometry(snowRadius, snowHeight, 8);
            const snowMesh = new THREE.Mesh(snowGeo, snowMat);
            snowMesh.position.y = height - snowHeight / 2;
            snowMesh.castShadow = true;
            mountainGroup.add(snowMesh);

            mountainGroup.position.set(x, 0, z);
            scene.add(mountainGroup);

            mountains.push({ x, z, radius: baseRadius * 0.95 });
        }

        // Haritanın etrafına dağlar - BOŞLUK KALMAYACAK
        const mountainRingRadius = MAP_LIMIT - 5;
        const mountainCount = 48;
        
        for (let i = 0; i < mountainCount; i++) {
            const angle = (i / mountainCount) * Math.PI * 2;
            const x = Math.cos(angle) * mountainRingRadius;
            const z = Math.sin(angle) * mountainRingRadius;
            const baseRadius = 18 + Math.random() * 6;
            const height = 45 + Math.random() * 25;
            createMountain(x, z, baseRadius, height);
        }

        // İkinci sıra (daha sağlam duvar)
        for (let i = 0; i < mountainCount; i++) {
            const angle = ((i + 0.5) / mountainCount) * Math.PI * 2;
            const x = Math.cos(angle) * (mountainRingRadius + 15);
            const z = Math.sin(angle) * (mountainRingRadius + 15);
            const baseRadius = 20 + Math.random() * 6;
            const height = 50 + Math.random() * 30;
            createMountain(x, z, baseRadius, height);
        }

        // İçeride dekoratif dağlar
        for (let i = 0; i < 6; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 100 + Math.random() * 60;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const baseRadius = 10 + Math.random() * 6;
            const height = 20 + Math.random() * 15;
            createMountain(x, z, baseRadius, height);
        }

        // ==========================================
        // ŞİMDİ OTLARI OLUŞTUR (dağlar tanımlı)
        // ==========================================
        const grassMat1 = new THREE.MeshLambertMaterial({ color: 0x2d7a1e });
        const grassMat2 = new THREE.MeshLambertMaterial({ color: 0x4a9c2a });
        const grassMat3 = new THREE.MeshLambertMaterial({ color: 0x1f5c14 });

        const grassAreaRadius = 180;
        const grassCount = 5000;

        for (let i = 0; i < grassCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.sqrt(Math.random()) * grassAreaRadius;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            
            // Dağ çarpışması kontrolü
            let inMountain = false;
            for (let m of mountains) {
                const dx = x - m.x;
                const dz = z - m.z;
                if (Math.sqrt(dx * dx + dz * dz) < m.radius + 1) {
                    inMountain = true;
                    break;
                }
            }
            if (inMountain) continue;

            const bladeCount = 4 + Math.floor(Math.random() * 4);
            const grassGroup = new THREE.Group();
            
            for (let j = 0; j < bladeCount; j++) {
                const h = 0.3 + Math.random() * 0.4;
                const bladeGeo = new THREE.BoxGeometry(0.06, h, 0.06);
                const mat = Math.random() > 0.66 ? grassMat2 : (Math.random() > 0.5 ? grassMat1 : grassMat3);
                const blade = new THREE.Mesh(bladeGeo, mat);
                blade.position.set(
                    (Math.random() - 0.5) * 0.5,
                    h / 2,
                    (Math.random() - 0.5) * 0.5
                );
                blade.rotation.z = (Math.random() - 0.5) * 0.4;
                blade.rotation.x = (Math.random() - 0.5) * 0.4;
                blade.castShadow = false;
                blade.receiveShadow = false;
                grassGroup.add(blade);
            }
            
            grassGroup.position.set(x, 0, z);
            grassGroup.rotation.y = Math.random() * Math.PI * 2;
            scene.add(grassGroup);
        }

        // ==========================================
        // EŞEK MODELİ
        // ==========================================
        function createDonkeyModel() {
            const donkeyGroup = new THREE.Group();
            const greyMat = new THREE.MeshLambertMaterial({ color: 0x808080 });
            const muzzleMat = new THREE.MeshLambertMaterial({ color: 0xdddddd });
            const blackMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

            function createBox(w, h, d, mat, x, y, z) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            const body = createBox(1.2, 1.0, 2.0, greyMat, 0, 1.5, 0);
            donkeyGroup.add(body);

            const neckHeadGroup = new THREE.Group();
            neckHeadGroup.position.set(0, 1.8, 0.7);

            const neck = createBox(0.6, 0.9, 0.6, greyMat, 0, 0.4, 0);
            neck.rotation.x = 0.3;
            neckHeadGroup.add(neck);
            
            const head = createBox(0.6, 0.6, 0.9, greyMat, 0, 0.9, 0.3);
            neckHeadGroup.add(head);
            
            const muzzle = createBox(0.58, 0.4, 0.4, muzzleMat, 0, 0.8, 0.75);
            neckHeadGroup.add(muzzle);

            const eyes = new THREE.Group();
            eyes.add(createBox(0.1, 0.1, 0.1, blackMat, 0.31, 1.0, 0.3));
            eyes.add(createBox(0.1, 0.1, 0.1, blackMat, -0.31, 1.0, 0.3));
            neckHeadGroup.add(eyes);

            const earLeft = createBox(0.15, 0.8, 0.2, greyMat, 0.25, 1.5, 0); earLeft.rotation.set(-0.2, 0, -0.2);
            const earRight = createBox(0.15, 0.8, 0.2, greyMat, -0.25, 1.5, 0); earRight.rotation.set(-0.2, 0, 0.2);
            neckHeadGroup.add(earLeft); neckHeadGroup.add(earRight);

            donkeyGroup.add(neckHeadGroup);

            const legs = [];
            [[0.4, 1.0, 0.7], [-0.4, 1.0, 0.7], [0.4, 1.0, -0.7], [-0.4, 1.0, -0.7]].forEach(pos => {
                const legGroup = new THREE.Group();
                legGroup.position.set(pos[0], pos[1], pos[2]);
                legGroup.add(createBox(0.3, 0.8, 0.3, greyMat, 0, -0.4, 0));
                legGroup.add(createBox(0.32, 0.2, 0.32, blackMat, 0, -0.9, 0));
                donkeyGroup.add(legGroup);
                legs.push(legGroup);
            });

            donkeyGroup.userData = { 
                legs, 
                neckHeadGroup,
                walkCycle: 0,
                jumpAnimProgress: 0,
                isMoving: false,
                isJumping: false,
                isCrouching: false
            };
            return donkeyGroup;
        }

        const playerDonkey = createDonkeyModel();
        playerDonkey.visible = false;
        scene.add(playerDonkey);

        function initWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;
            ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === "init") {
                        myId = data.id;
                    }

                    if (data.type === "players" && myId) {
                        const serverPlayers = data.players;

                        for (let id in serverPlayers) {
                            if (id !== myId) {
                                if (!otherPlayers[id]) {
                                    const newDonkey = createDonkeyModel();
                                    scene.add(newDonkey);
                                    otherPlayers[id] = newDonkey;
                                }
                                const pData = serverPlayers[id];
                                const other = otherPlayers[id];
                                
                                other.position.set(pData.x, pData.y, pData.z);
                                other.rotation.y = pData.yaw || 0;
                                
                                if (other.userData.neckHeadGroup) {
                                    other.userData.neckHeadGroup.rotation.x = pData.pitch || 0;
                                }
                                
                                const targetScale = pData.isCrouching ? 0.6 : 1.0;
                                other.scale.y += (targetScale - other.scale.y) * 0.5;
                                
                                other.userData.isMoving = pData.isMoving || false;
                                other.userData.isJumping = pData.isJumping || false;
                                other.userData.isCrouching = pData.isCrouching || false;
                            }
                        }

                        for (let id in otherPlayers) {
                            if (!serverPlayers[id]) {
                                scene.remove(otherPlayers[id]);
                                delete otherPlayers[id];
                            }
                        }
                    }
                } catch (e) {
                    console.error("Veri hatası:", e);
                }
            };
        }

        let gameStarted = false;
        let yaw = 0, pitch = 0.3, velocityY = 0;
        let isGrounded = true;
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        const keys = { w: false, a: false, s: false, d: false, c: false, shift: false };

        let joystickActive = false;
        let joystickMoveX = 0, joystickMoveZ = 0;
        let isCouchingMobile = false;
        let isSprintingMobile = false;

        let joystickTouchId = null;
        let cameraTouchId = null;
        let cameraLastX = 0, cameraLastY = 0;

        const menuEl = document.getElementById('menu');
        const mainButtons = document.getElementById('mainButtons');
        const pauseButtons = document.getElementById('pauseButtons');
        const resumeBtn = document.getElementById('resumeBtn');
        const returnMenuBtn = document.getElementById('returnMenuBtn');
        const pcSelectBtn = document.getElementById('pcSelectBtn');
        const mobileSelectBtn = document.getElementById('mobileSelectBtn');
        const infoEl = document.getElementById('info');
        const mobileControlsEl = document.getElementById('mobileControls');
        const hudEl = document.getElementById('hud');
        const hudTimeEl = document.getElementById('hudTime');
        const hudFpsEl = document.getElementById('hudFps');
        const hudDayEl = document.getElementById('hudDay');

        function startGame(mode) {
            controlMode = mode;
            initWebSocket();
            playerDonkey.position.set(0, 0, 0);
            gameStarted = true;
            menuEl.style.display = 'none';
            playerDonkey.visible = true;
            hudEl.style.display = 'block';

            if (controlMode === 'pc') {
                infoEl.style.display = 'block';
                mobileControlsEl.style.display = 'none';
            } else {
                infoEl.style.display = 'none';
                mobileControlsEl.style.display = 'block';
            }
        }

        pcSelectBtn.addEventListener('click', () => startGame('pc'));
        mobileSelectBtn.addEventListener('click', () => startGame('mobile'));

        resumeBtn.addEventListener('click', () => {
            initWebSocket();
            gameStarted = true;
            menuEl.style.display = 'none';
            playerDonkey.visible = true;
            hudEl.style.display = 'block';
            infoEl.style.display = controlMode === 'pc' ? 'block' : 'none';
            mobileControlsEl.style.display = controlMode === 'mobile' ? 'block' : 'none';
        });

        returnMenuBtn.addEventListener('click', () => {
            gameStarted = false;
            menuEl.style.display = 'flex';
            mainButtons.style.display = 'block';
            pauseButtons.style.display = 'none';
            infoEl.style.display = 'none';
            mobileControlsEl.style.display = 'none';
            hudEl.style.display = 'none';
            playerDonkey.visible = false;
            if (ws) { ws.close(); ws = null; }
            for (let id in otherPlayers) {
                scene.remove(otherPlayers[id]);
                delete otherPlayers[id];
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && gameStarted) {
                gameStarted = false;
                menuEl.style.display = 'flex';
                mainButtons.style.display = 'none';
                pauseButtons.style.display = 'flex';
                infoEl.style.display = 'none';
                mobileControlsEl.style.display = 'none';
                hudEl.style.display = 'none';
                playerDonkey.visible = false;
                return;
            }
            if (!gameStarted || controlMode !== 'pc') return;

            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = true;
            if (k === 'a') keys.a = true;
            if (k === 's') keys.s = true;
            if (k === 'd') keys.d = true;
            if (k === 'c') keys.c = true;
            if (k === 'shift') keys.shift = true;
            if (e.code === 'Space' && isGrounded) {
                velocityY = 0.35;
                isGrounded = false;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (!gameStarted || controlMode !== 'pc') return;
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = false;
            if (k === 'a') keys.a = false;
            if (k === 's') keys.s = false;
            if (k === 'd') keys.d = false;
            if (k === 'c') keys.c = false;
            if (k === 'shift') keys.shift = false;
        });

        document.addEventListener('mousedown', (e) => {
            if (!gameStarted || controlMode !== 'pc' || e.button !== 0) return;
            isMouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        document.addEventListener('mouseup', () => { isMouseDown = false; });
        document.addEventListener('mousemove', (e) => {
            if (!gameStarted || !isMouseDown || controlMode !== 'pc') return;
            yaw -= (e.clientX - mouseX) * 0.005;
            pitch -= (e.clientY - mouseY) * 0.005;
            pitch = Math.max(-0.6, Math.min(1.0, pitch));
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        const joystickZone = document.getElementById('joystickZone');
        const joystickKnob = document.getElementById('joystickKnob');
        const mobJumpBtn = document.getElementById('mobJumpBtn');
        const mobCrouchBtn = document.getElementById('mobCrouchBtn');
        const mobSprintBtn = document.getElementById('mobSprintBtn');
        const mobMenuBtn = document.getElementById('mobMenuBtn');
        
        let touchStartX = 0, touchStartY = 0;

        mobMenuBtn.addEventListener('click', () => {
            if (gameStarted) {
                gameStarted = false;
                menuEl.style.display = 'flex';
                mainButtons.style.display = 'none';
                pauseButtons.style.display = 'flex';
                infoEl.style.display = 'none';
                mobileControlsEl.style.display = 'none';
                hudEl.style.display = 'none';
                playerDonkey.visible = false;
            }
        });

        // JOYSTICK
        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (joystickTouchId !== null) return;
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            joystickActive = true;
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }, { passive: false });

        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (joystickTouchId === null) return;
            
            let touch = null;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    touch = e.changedTouches[i];
                    break;
                }
            }
            if (!touch) return;
            
            let dX = touch.clientX - touchStartX;
            let dY = touch.clientY - touchStartY;
            let dist = Math.min(45, Math.sqrt(dX * dX + dY * dY));
            let angle = Math.atan2(dY, dX);
            
            joystickKnob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            
            joystickMoveX = Math.cos(angle) * (dist / 45);
            joystickMoveZ = Math.sin(angle) * (dist / 45);
        }, { passive: false });

        joystickZone.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    joystickTouchId = null;
                    joystickActive = false;
                    joystickKnob.style.transform = `translate(0px, 0px)`;
                    joystickMoveX = 0; joystickMoveZ = 0;
                    break;
                }
            }
        }, { passive: false });

        joystickZone.addEventListener('touchcancel', () => {
            joystickTouchId = null;
            joystickActive = false;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            joystickMoveX = 0; joystickMoveZ = 0;
        });

        // KAMERA DÖNDÜRME
        window.addEventListener('touchstart', (e) => {
            if (!gameStarted || controlMode !== 'mobile') return;
            
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (!target) continue;
                
                if (target.closest('#joystickZone') || 
                    target.closest('.mob-btn-group') || 
                    target.closest('#mobMenuBtn') ||
                    target.closest('#menu')) {
                    continue;
                }
                
                if (cameraTouchId === null) {
                    cameraTouchId = touch.identifier;
                    cameraLastX = touch.clientX;
                    cameraLastY = touch.clientY;
                }
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (!gameStarted || controlMode !== 'mobile') return;
            if (cameraTouchId === null) return;
            
            let touch = null;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === cameraTouchId) {
                    touch = e.changedTouches[i];
                    break;
                }
            }
            if (!touch) return;
            
            const tX = touch.clientX;
            const tY = touch.clientY;
            
            yaw -= (tX - cameraLastX) * 0.005;
            pitch -= (tY - cameraLastY) * 0.005;
            pitch = Math.max(-0.6, Math.min(1.0, pitch));
            
            cameraLastX = tX;
            cameraLastY = tY;
            
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (cameraTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === cameraTouchId) {
                    cameraTouchId = null;
                    break;
                }
            }
        });

        window.addEventListener('touchcancel', () => {
            cameraTouchId = null;
        });

        mobJumpBtn.addEventListener('click', () => {
            if (gameStarted && isGrounded) { velocityY = 0.35; isGrounded = false; }
        });
        mobCrouchBtn.addEventListener('touchstart', () => { isCouchingMobile = true; });
        mobCrouchBtn.addEventListener('touchend', () => { isCouchingMobile = false; });
        mobSprintBtn.addEventListener('touchstart', () => { isSprintingMobile = true; });
        mobSprintBtn.addEventListener('touchend', () => { isSprintingMobile = false; });

        // === ÇARPIŞMA ===
        function checkMountainCollision(x, z, radius) {
            for (let m of mountains) {
                const dx = x - m.x;
                const dz = z - m.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist < m.radius + radius) {
                    return true;
                }
            }
            return false;
        }

        // === ANİMASYON ===
        function updateDonkeyAnimation(donkey, isMoving, isJumping, isCrouching, speedMultiplier) {
            const legs = donkey.userData.legs;
            const ud = donkey.userData;
            
            if (isJumping && !isCrouching) {
                ud.jumpAnimProgress += 0.15;
                const jumpAngle = Math.sin(ud.jumpAnimProgress) * 0.6;
                legs[0].rotation.x = jumpAngle;
                legs[1].rotation.x = -jumpAngle;
                legs[2].rotation.x = -jumpAngle;
                legs[3].rotation.x = jumpAngle;
            } else if (isMoving && !isCrouching) {
                ud.walkCycle += (speedMultiplier || 1) * 0.15;
                legs[0].rotation.x = Math.sin(ud.walkCycle) * 0.5;
                legs[1].rotation.x = -Math.sin(ud.walkCycle) * 0.5;
                legs[2].rotation.x = -Math.sin(ud.walkCycle) * 0.5;
                legs[3].rotation.x = Math.sin(ud.walkCycle) * 0.5;
            } else {
                legs.forEach(l => l.rotation.x *= 0.8);
            }
            
            if (!isJumping) {
                ud.jumpAnimProgress = 0;
            }
        }

        // === ZAMAN ===
        let gameTime = 8.0;
        let gameDay = 1;
        const TIME_SPEED = 0.4;
        const DAY_DURATION = 24;

        // === FPS ===
        let fpsFrames = 0;
        let fpsLastTime = performance.now();
        let currentFps = 60;

        let lastFrameTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const deltaSec = (now - lastFrameTime) / 1000;
            lastFrameTime = now;

            fpsFrames++;
            if (now - fpsLastTime >= 1000) {
                currentFps = fpsFrames;
                fpsFrames = 0;
                fpsLastTime = now;
            }

            if (gameStarted) {
                gameTime += TIME_SPEED * deltaSec;
                if (gameTime >= DAY_DURATION) {
                    gameTime -= DAY_DURATION;
                    gameDay++;
                }

                const hours = Math.floor(gameTime);
                const minutes = Math.floor((gameTime - hours) * 60);
                hudTimeEl.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
                hudFpsEl.textContent = currentFps;
                hudDayEl.textContent = gameDay;

                // Güneş/Ay
                const sunAngle = ((gameTime - 6) / 12) * Math.PI;
                const sunX = Math.cos(sunAngle - Math.PI / 2) * 250;
                const sunY = Math.sin(sunAngle) * 250;
                const sunZ = 0;

                sunMesh.position.set(sunX, sunY, sunZ);
                sunLight.position.set(sunX, sunY, sunZ);

                moonMesh.position.set(-sunX, -sunY, -sunZ);
                moonLight.position.set(-sunX, -sunY, -sunZ);

                let skyR, skyG, skyB;
                if (gameTime >= 6 && gameTime <= 18) {
                    const t = (gameTime - 6) / 12;
                    const morningFactor = Math.max(0, 1 - t * 4);
                    const eveningFactor = Math.max(0, (t - 0.75) * 4);
                    const orangeR = 1.0, orangeG = 0.6, orangeB = 0.3;
                    const blueR = 0.53, blueG = 0.81, blueB = 0.92;
                    let mixFactor = Math.max(morningFactor, eveningFactor);
                    skyR = blueR * (1 - mixFactor) + orangeR * mixFactor;
                    skyG = blueG * (1 - mixFactor) + orangeG * mixFactor;
                    skyB = blueB * (1 - mixFactor) + orangeB * mixFactor;
                } else {
                    skyR = 0.05; skyG = 0.05; skyB = 0.15;
                }
                scene.background = new THREE.Color(skyR, skyG, skyB);

                const isDay = gameTime >= 6 && gameTime <= 18;
                sunLight.intensity = isDay ? 1.0 : 0.0;
                moonLight.intensity = isDay ? 0.0 : 0.3;
                ambientLight.intensity = isDay ? 0.5 : 0.15;

                // HAREKET
                let isCrouching = controlMode === 'pc' ? keys.c : isCouchingMobile;
                let isSprinting = controlMode === 'pc' ? keys.shift : isSprintingMobile;
                
                let baseSpeed = isCrouching ? 0.06 : 0.12;
                if (isSprinting && !isCrouching) baseSpeed = 0.25;
                const speed = baseSpeed;
                
                let moveX = 0, moveZ = 0, isMoving = false;

                if (controlMode === 'pc') {
                    if (keys.w) { moveX += Math.sin(yaw) * speed; moveZ += Math.cos(yaw) * speed; isMoving = true; }
                    if (keys.s) { moveX -= Math.sin(yaw) * speed; moveZ -= Math.cos(yaw) * speed; isMoving = true; }
                    if (keys.a) { moveX += Math.cos(yaw) * speed; moveZ -= Math.sin(yaw) * speed; isMoving = true; }
                    if (keys.d) { moveX -= Math.cos(yaw) * speed; moveZ += Math.sin(yaw) * speed; isMoving = true; }
                } else {
                    if (joystickActive) {
                        const ileriGeri = -joystickMoveZ;
                        const sagSol = joystickMoveX;
                        
                        moveX = (Math.sin(yaw) * ileriGeri + Math.cos(yaw) * sagSol) * speed * 1.5;
                        moveZ = (Math.cos(yaw) * ileriGeri - Math.sin(yaw) * sagSol) * speed * 1.5;
                        
                        isMoving = true;
                    }
                }

                // ÇARPIŞMA
                const newX = playerDonkey.position.x + moveX;
                const newZ = playerDonkey.position.z + moveZ;
                
                let canMoveX = !checkMountainCollision(newX, playerDonkey.position.z, 1.0);
                let canMoveZ = !checkMountainCollision(playerDonkey.position.x, newZ, 1.0);
                let canMoveBoth = !checkMountainCollision(newX, newZ, 1.0);
                
                if (canMoveBoth) {
                    playerDonkey.position.x = newX;
                    playerDonkey.position.z = newZ;
                } else if (canMoveX) {
                    playerDonkey.position.x = newX;
                } else if (canMoveZ) {
                    playerDonkey.position.z = newZ;
                }
                
                // HARİTA SINIRI
                const distFromCenter = Math.sqrt(playerDonkey.position.x ** 2 + playerDonkey.position.z ** 2);
                if (distFromCenter > MAP_LIMIT) {
                    const scale = MAP_LIMIT / distFromCenter;
                    playerDonkey.position.x *= scale;
                    playerDonkey.position.z *= scale;
                }
                
                playerDonkey.rotation.y = yaw;

                playerDonkey.scale.y += ((isCrouching ? 0.6 : 1.0) - playerDonkey.scale.y) * 0.5;

                velocityY -= 0.015;
                playerDonkey.position.y += velocityY;
                if (playerDonkey.position.y <= 0) { playerDonkey.position.y = 0; velocityY = 0; isGrounded = true; }

                const isJumping = !isGrounded;
                updateDonkeyAnimation(playerDonkey, isMoving, isJumping, isCrouching, isSprinting ? 1.5 : 1);

                if (playerDonkey.userData.neckHeadGroup) {
                    playerDonkey.userData.neckHeadGroup.rotation.x = pitch;
                }

                for (let id in otherPlayers) {
                    const other = otherPlayers[id];
                    const ud = other.userData;
                    updateDonkeyAnimation(
                        other, 
                        ud.isMoving || false, 
                        ud.isJumping || false, 
                        ud.isCrouching || false, 
                        1
                    );
                }

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "move",
                        x: playerDonkey.position.x,
                        y: playerDonkey.position.y,
                        z: playerDonkey.position.z,
                        yaw: yaw,
                        pitch: pitch,
                        isCrouching: isCrouching,
                        isMoving: isMoving,
                        isJumping: isJumping
                    }));
                }

                const distance = 6, heightOffset = isCrouching ? 1.8 : 2.5;
                camera.position.set(
                    playerDonkey.position.x - Math.sin(yaw) * distance,
                    playerDonkey.position.y + heightOffset + (pitch * 2),
                    playerDonkey.position.z - Math.cos(yaw) * distance
                );
                camera.lookAt(new THREE.Vector3(playerDonkey.position.x, playerDonkey.position.y + (isCrouching ? 1.0 : 1.5), playerDonkey.position.z));
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
